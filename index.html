<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Для жены</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4f8b;
    --bg1:#ffe3f0;
    --bg2:#ffffff;
    --shadow: 0 20px 60px rgba(0,0,0,.10);
    --radius: 24px;
    --yes:#31c56b;
    --no:#ff5b6a;
    --pad: clamp(18px, 4vw, 34px);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
    overflow:hidden;
    background:
      radial-gradient(900px 500px at 50% 20%, var(--bg1) 0%, #fff7fb 45%, var(--bg2) 100%);
    font-family:'Quicksand', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:#2b2b2b;
  }
  canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  /* --- Decor: soft blobs behind the card (very subtle) --- */
  .bgBlob{
    position:fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(40px);
    opacity: .28;
    pointer-events:none;
    animation: blobFloat 8s ease-in-out infinite;
  }
  .b1{ left:-140px; top:10%; background: #ffd3e6; }
  .b2{ right:-160px; bottom:8%; background: #ffe9c8; animation-delay: 1.6s; }
  @keyframes blobFloat{
    0%,100%{ transform: translateY(0) translateX(0) }
    50%{ transform: translateY(-18px) translateX(10px) }
  }
  .card{
    width: min(520px, 100%);
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: var(--pad);
    text-align:center;
    border: 1px solid rgba(255,255,255,.75);
    outline: 1px solid rgba(255,79,139,.18);
    position: relative;
    animation: cardIn .75s ease both;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius: calc(var(--radius) + 2px);
    background: radial-gradient(600px 160px at 50% 0%, rgba(255,79,139,.14), transparent 60%);
    pointer-events:none;
  }
  .sticker{
    position:absolute;
    font-size: 18px;
    opacity:.42;
    filter: blur(.1px);
    animation: drift 6s ease-in-out infinite;
    pointer-events:none;
  }
  .s1{ top:14px; left:16px; animation-delay:0s }
  .s2{ top:14px; right:16px; animation-delay:1.2s }
  .s3{ bottom:12px; left:18px; animation-delay:2.3s }
  .s4{ bottom:12px; right:18px; animation-delay:3.1s }
  @keyframes drift{
    0%,100%{ transform: translateY(0) rotate(0deg) }
    50%{ transform: translateY(-10px) rotate(4deg) }
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(18px) scale(.98); filter: blur(4px); }
    to{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .popIn{
    animation: popIn .55s ease both;
  }
  @keyframes popIn{
    0%{ transform: scale(.98); }
    60%{ transform: scale(1.02); }
    100%{ transform: scale(1); }
  }
  .bear{
    width: clamp(92px, 22vw, 130px);
    height: auto;
    display:block;
    margin: 0 auto 10px;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.08));
    animation: floaty 2.6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) }
    50%{ transform: translateY(-7px) }
  }
  .title{
    font-family:'Pacifico', cursive;
    font-size: clamp(26px, 6vw, 40px);
    color: var(--pink);
    margin: 6px 0 6px;
    line-height: 1.15;
    word-break: break-word;
  }
  .subtitle{
    font-size: clamp(13px, 3.6vw, 16px);
    color:#666;
    margin: 0 0 12px;
  }
  .question{
    font-size: clamp(16px, 4.6vw, 22px);
    margin: 12px 0 18px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.04)}
    100%{transform:scale(1)}
  }
  .btnRow{
    display:flex;
    gap: 12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top: 6px;
  }
  button{
    border:none;
    border-radius: 14px;
    padding: 12px 18px;
    font-size: clamp(15px, 4vw, 17px);
    cursor:pointer;
    box-shadow: 0 10px 18px rgba(0,0,0,.08);
    transition: transform .18s ease, opacity .18s ease;
    user-select:none;
    min-width: 120px;
    max-width: 260px;
    width: clamp(140px, 42vw, 180px);
  }
  button:active{ transform: translateY(1px) scale(.99); }
  #yesBtn{ background: var(--yes); color:#fff; transform-origin:center; }
  #noBtn{ background: var(--no); color:#fff; opacity: .95; }
  .hidden{ display:none; }
  .yay{
    font-family:'Pacifico', cursive;
    font-size: clamp(28px, 7vw, 44px);
    color: var(--pink);
    margin: 2px 0 10px;
    line-height: 1.1;
    animation: pop .7s ease;
  }
  @keyframes pop{
    from{transform:scale(.6); opacity:0}
    to{transform:scale(1); opacity:1}
  }
  .photoWrap{
    width: 100%;
    max-width: 420px;
    margin: 12px auto 10px;
    border-radius: 20px;
    overflow:hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,.7);
    aspect-ratio: 4 / 3;
    position: relative;
  }
  .photoWrap::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius: 20px;
    background: radial-gradient(380px 140px at 50% 0%, rgba(255,255,255,.35), transparent 55%);
    pointer-events:none;
  }
  .photoWrap img{
    width:100%;
    height:100%;
    display:block;
    object-fit: cover;
  }
  .footerNote{
    color:#666;
    font-size: clamp(12px, 3.6vw, 14px);
    margin-top: 8px;
    white-space: pre-line;
  }
  @media (max-width: 360px){
    button{ width: 100%; min-width: 0; }
    .btnRow{ gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="bgBlob b1"></div>
<div class="bgBlob b2"></div>
<div class="card" id="card">
  <div class="sticker s1">🎈</div>
  <div class="sticker s2">🎂</div>
  <div class="sticker s3">✨</div>
  <div class="sticker s4">💛</div>
  <!-- ASK SCREEN -->
  <div id="askScreen">
    <img src="assets/bear.gif" class="bear" alt="cute bear"/>
    <div class="title">Моей любимой жене 💕</div>
    <div class="question" id="questionText">
      Готова принять поздравления от своего мужа? 🎉
    </div>
    <div class="subtitle">
      Сделал эту маленькую страничку просто чтобы ты улыбнулась в свой день ✨
    </div>
    <div class="btnRow">
      <button id="yesBtn">Готова! 🎂</button>
      <button id="noBtn">Дай подумать</button>
    </div>
  </div>
  <!-- YES SCREEN -->
  <div id="yesScreen" class="hidden">
    <div class="yay">С днём рождения! 🎉🎂</div>
    <div class="photoWrap">
      <img src="assets/us.jpeg" alt="us"/>
    </div>
    <div class="footerNote">С днём рождения, любимая!
Спасибо, что ты есть в моей жизни.
Я люблю тебя 💛</div>
  </div>
</div>
<!-- music (won't auto-play until we call playMusic on YES) -->
<audio id="bgMusic" loop preload="auto">
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>
<script>
  // --- No button texts ---
  const texts = [
    "Ты уверена? 🥺",
    "Точно уверена?",
    "Прям на 100% уверена?",
    "Подумай ещё раз 😳",
    "Пожалуйста, передумай 🫶",
    "Моё сердце начинает волноваться 💓",
    "Не делай так со мной в твой же день 😭",
    "Может, это последний шанс…?",
    "Ты абсолютно точно уверена??",
    "Я приготовил столько поздравлений 😇",
    "Ладно… но почему нет? 😔",
    "Ты разбиваешь моё маленькое пиксельное сердце 💔",
    "Давай представим, что ты нажала «Да» 😄",
    "Я спрошу ещё раз вежливо…",
    "Всё ещё нет? 🥲",
    "Может, ты случайно нажала?",
    "Попробуй зелёную кнопку 😌",
    "Ещё раз… пожалуйста?",
    "Это правда последний шанс…",
    "Самый-самый последний шанс 😭",
    "Ладно… я всё равно не сдамся, с днём рождения тебя 😤"
  ];
  const card = document.getElementById("card");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const text = document.getElementById("questionText");
  const ask = document.getElementById("askScreen");
  const yesScreen = document.getElementById("yesScreen");
  let count = 0;
  let yesScale = 1;
  noBtn.addEventListener("click", () => {
    text.textContent = texts[Math.min(count, texts.length - 1)];
    count++;
    yesScale = Math.min(3.2, yesScale + 0.12);
    yesBtn.style.transform = `scale(${yesScale})`;
    noBtn.style.opacity = String(Math.max(0.45, 0.95 - count * 0.03));
  });
  // --- Music: start ONLY when the photo card appears ---
  const music = document.getElementById("bgMusic");
  function playMusic(){
    music.volume = 0.45;
    music.play().catch(()=>{});
  }
  yesBtn.addEventListener("click", () => {
    ask.classList.add("hidden");
    yesScreen.classList.remove("hidden");
    card.classList.remove("popIn");
    void card.offsetWidth; // restart animation
    card.classList.add("popIn");
    startHearts();    // hearts start here
    playMusic();      // music starts here (exact moment)
  });
  // --- Hearts animation (minimal outline hearts) ---
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  let hearts = [];
  let running = false;
  let rafId = null;
  function startHearts(){
    hearts = [];
    running = true;
    const amount = Math.round(
      Math.min(180, Math.max(90, window.innerWidth / 6))
    );
    for(let i=0;i<amount;i++){
      const size = Math.random()*14 + 10;
      hearts.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*-window.innerHeight,
        size,
        speed: Math.random()*1.6 + 0.9,
        sway: Math.random()*1.4 + 0.4,
        phase: Math.random()*Math.PI*2,
        rot: (Math.random()*18 - 9) * Math.PI/180,
        rotSpeed: (Math.random()*0.6 - 0.3) * 0.01,
        alpha: Math.random()*0.25 + 0.35,
        line: Math.random()*1.3 + 0.9,
        hue: 340 + Math.random()*18,
        sat: 70 + Math.random()*10,
        light: 62 + Math.random()*10
      });
    }
    if(rafId) cancelAnimationFrame(rafId);
    animateHearts();
  }
  function heartPath(ctx, size){
    const s = size;
    ctx.beginPath();
    ctx.moveTo(0, s*0.30);
    ctx.bezierCurveTo(0, -s*0.15, -s*0.55, -s*0.10, -s*0.55, s*0.30);
    ctx.bezierCurveTo(-s*0.55, s*0.65, -s*0.18, s*0.92, 0, s*1.10);
    ctx.bezierCurveTo(s*0.18, s*0.92, s*0.55, s*0.65, s*0.55, s*0.30);
    ctx.bezierCurveTo(s*0.55, -s*0.10, 0, -s*0.15, 0, s*0.30);
    ctx.closePath();
  }
  function drawOutlineHeart(h){
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.lineWidth = h.line;
    ctx.strokeStyle = `hsla(${h.hue}, ${h.sat}%, ${h.light}%, ${h.alpha})`;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    heartPath(ctx, h.size);
    ctx.stroke();
    ctx.restore();
  }
  function animateHearts(){
    if(!running) return;
    ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    for(const h of hearts){
      h.y += h.speed;
      h.x += Math.sin((h.y*0.01) + h.phase) * h.sway;
      h.rot += h.rotSpeed;
      drawOutlineHeart(h);
      if(h.y > window.innerHeight + 50){
        h.y = -30;
        h.x = Math.random()*window.innerWidth;
      }
    }
    rafId = requestAnimationFrame(animateHearts);
  }
</script>
</body>
</html>
